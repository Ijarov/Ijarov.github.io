<svg class="diagram" viewBox="0 0 900 300" role="img" aria-labelledby="loop-title loop-desc" xmlns="http://www.w3.org/2000/svg">
<title id="loop-title">Speed control loop</title>
<desc id="loop-desc">The setpoint and the measured speed feed an op-amp PI controller, which drives the motor through a BJT stage. The encoder pulses are counted, latched, and converted back to a voltage by an R-2R DAC, closing the loop.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>
<style>.blk{fill:#fff;stroke:#18222D;stroke-width:1.5}.blk-hl{fill:#fff;stroke:#D4A000;stroke-width:3}.lbl{font:600 19px "Barlow Condensed",sans-serif;fill:#18222D;text-anchor:middle}.sub{font:400 14px Barlow,sans-serif;fill:#56616C;text-anchor:middle}.wire{stroke:#0E6A87;stroke-width:2;fill:none}.ahead{fill:#0E6A87}.note{font:italic 400 14px Barlow,sans-serif;fill:#56616C}</style>
<text class="note" x="18" y="77.0">setpoint</text>
<line class="wire" x1="80" y1="72.0" x2="140" y2="72.0" marker-end="url(#ah)"/>
<rect class="blk" x="140" y="40" width="150" height="64" rx="3"/><text class="lbl" x="215.0" y="68.0">PI controller</text><text class="sub" x="215.0" y="88.0">op-amp</text>
<line class="wire" x1="290" y1="72.0" x2="370" y2="72.0" marker-end="url(#ah)"/>
<rect class="blk" x="370" y="40" width="150" height="64" rx="3"/><text class="lbl" x="445.0" y="68.0">Driver</text><text class="sub" x="445.0" y="88.0">BJT</text>
<line class="wire" x1="520" y1="72.0" x2="600" y2="72.0" marker-end="url(#ah)"/>
<rect class="blk" x="600" y="40" width="150" height="64" rx="3"/><text class="lbl" x="675.0" y="78.0">DC motor</text>
<path class="wire" d="M750,72.0 L830,72.0 L830,232.0 L752,232.0" marker-end="url(#ah)"/>
<rect class="blk" x="600" y="200" width="150" height="64" rx="3"/><text class="lbl" x="675.0" y="228.0">Encoder</text><text class="sub" x="675.0" y="248.0">pulses</text>
<line class="wire" x1="600" y1="232.0" x2="522" y2="232.0" marker-end="url(#ah)"/>
<rect class="blk" x="450" y="200" width="70" height="64" rx="3"/><text class="lbl" x="485.0" y="238.0">Counter</text>
<line class="wire" x1="450" y1="232.0" x2="402" y2="232.0" marker-end="url(#ah)"/>
<rect class="blk" x="330" y="200" width="70" height="64" rx="3"/><text class="lbl" x="365.0" y="238.0">Latch</text>
<line class="wire" x1="330" y1="232.0" x2="292" y2="232.0" marker-end="url(#ah)"/>
<rect class="blk-hl" x="140" y="200" width="150" height="64" rx="3"/><text class="lbl" x="215.0" y="228.0">R-2R DAC</text><text class="sub" x="215.0" y="248.0">speed as voltage</text>
<line class="wire" x1="215" y1="200" x2="215" y2="106" marker-end="url(#ah)"/>
<text class="note" x="225" y="157.0">measured speed</text>
</svg>