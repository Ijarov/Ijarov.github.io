<svg class="diagram" viewBox="0 0 480 300" role="img" aria-labelledby="st-title st-desc" xmlns="http://www.w3.org/2000/svg">
<title id="st-title">Q-learning state from the camera image</title>
<desc id="st-desc">The camera frame is split into left, centre, and right zones. The zone that contains the line becomes the agent's state.</desc>
<style>.frame{fill:#fff;stroke:#18222D;stroke-width:1.5}.zone{fill:none;stroke:#D5DCDA;stroke-width:1.5}.hit{fill:#D4A000;fill-opacity:.18;stroke:#D4A000;stroke-width:2.5}.line{fill:none;stroke:#18222D;stroke-width:14;stroke-linecap:round}.zl{font:600 18px "Barlow Condensed",sans-serif;fill:#56616C;text-anchor:middle}</style>
<rect class="frame" x="20" y="20" width="440" height="230" rx="3"/>
<rect class="hit" x="166.7" y="20" width="146.6" height="230"/>
<line class="zone" x1="166.7" y1="20" x2="166.7" y2="250"/><line class="zone" x1="313.3" y1="20" x2="313.3" y2="250"/>
<path class="line" d="M215,250 C230,180 270,120 330,20"/>
<text class="zl" x="93" y="282">left</text><text class="zl" x="240" y="282">centre</text><text class="zl" x="387" y="282">right</text>
</svg>